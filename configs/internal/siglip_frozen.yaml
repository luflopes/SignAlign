# internal_siglip_frozen
# Esquema FROZEN: modelo base off-the-shelf, encoders congelados, eval-only no val interno.
# Modelo: google/siglip-base-patch16-224 (siglip)
seed: 5932
output_dir: experiments/internal
name: internal_siglip_frozen
data:
  dataset_csv: datasets/internal-dataset/val.csv
  images_base_path: datasets/internal-dataset
  train_ratio: 0.0
  val_ratio: 1.0
  batch_size: 32
  num_workers: 4
  exclude_unknown: false
  max_samples: null
  augmentation:
    enabled: false
  split_path: null
training:
  epochs: 0
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_amp: true
  save_every: 5
  save_top_k: 3
  save_only_best: true
  log_interval: 50
  early_stopping_patience: 10
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    min_lr: 1.0e-08
    mode: max
evaluation:
  negative_samples:
  - 1
  - 2
  - 3
  compute_eer: true
  compute_auc: true
  compute_recall_at_k: true
  recall_k_values:
  - 1
  - 5
  - 10
  compute_mrr: true
  compute_ndcg: true
  num_visualization_samples: 10
  save_attention_maps: false
loss:
  primary_loss: sigmoid
  temperature: 0.07
  use_triplet_loss: true
  triplet_weight: 0.3
  triplet_margin: 0.2
  sigmoid_bias: -10.0
model:
  name: google/siglip-base-patch16-224
  type: siglip
  image_size: 224
  freeze_vision_encoder: true
  freeze_text_encoder: true
  output_attentions: false
