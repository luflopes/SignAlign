seed: 5932
output_dir: experiments
data:
  dataset_csv: datasets/dataset-sign-align/dataset.csv
  images_base_path: datasets/dataset-sign-align
  train_ratio: 0.75
  val_ratio: 0.1
  batch_size: 32
  num_workers: 4
  exclude_unknown: true
  max_samples: null
  augmentation:
    enabled: false
    shift_limit:
    - -0.0625
    - 0.0625
    scale_limit:
    - -0.1
    - 0.1
    rotate_limit:
    - -10
    - 15
    downscale_range:
    - 0.4
    - 1.0
    motion_blur_limit:
    - 3
    - 5
    noise_std_range:
    - 0.1
    - 0.2
    brightness_limit:
    - -0.2
    - 0.2
    contrast_limit:
    - -0.2
    - 0.2
    compression_quality_range:
    - 40
    - 100
    geometric_p: 0.2
    blur_noise_p: 0.2
    color_p: 0.2
    compression_p: 0.2
  split_path: data/splits/split_v2.json
  test_ratio: 0.15
training:
  epochs: 0
  learning_rate: 1.0e-06
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_amp: true
  save_every: 5
  save_top_k: 3
  save_only_best: true
  log_interval: 50
  early_stopping_patience: 10
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    min_lr: 1.0e-08
    mode: max
evaluation:
  negative_samples:
  - 1
  - 2
  - 3
  compute_eer: true
  compute_auc: true
  compute_recall_at_k: true
  recall_k_values:
  - 1
  - 5
  - 10
  compute_mrr: true
  compute_ndcg: true
  num_visualization_samples: 10
  save_attention_maps: true
loss:
  primary_loss: cross_entropy
  temperature: 0.07
  use_triplet_loss: false
  triplet_weight: 0.2
  triplet_margin: 0.2
  sigmoid_bias: -10.0
name: clip_vit_b16_frozen_eval
model:
  name: openai/clip-vit-base-patch16
  type: clip
  image_size: 224
  freeze_vision_encoder: true
  freeze_text_encoder: true
  output_attentions: true
