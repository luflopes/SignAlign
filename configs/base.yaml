# Configuração base para experimentos SignAlign
# Este arquivo serve como template para criar novas configurações

name: "baseline_tinyclip"
description: "Experimento baseline com TinyCLIP"
seed: 5932
output_dir: "experiments"

model:
  name: "wkcn/TinyCLIP-ViT-40M-32-Text-19M-LAION400M"
  type: "tinyclip"
  image_size: 224
  freeze_vision_encoder: false
  freeze_text_encoder: false
  output_attentions: true

training:
  epochs: 20
  learning_rate: 1.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_amp: true
  save_every: 1
  save_top_k: 3
  save_only_best: true  # Se true, salva apenas o melhor modelo
  log_interval: 50
  early_stopping_patience: 5
  
  scheduler:
    name: "reduce_on_plateau"
    factor: 0.5
    patience: 3
    min_lr: 1.0e-8
    mode: "max"

data:
  dataset_csv: "datasets/dataset-sign-align/dataset.csv"
  images_base_path: "datasets/dataset-sign-align"
  train_ratio: 0.85
  val_ratio: 0.15
  batch_size: 8
  num_workers: 2
  exclude_unknown: true
  max_samples: null  # Defina um número para modo teste (ex: 100)
  
  augmentation:
    enabled: true
    shift_limit: [-0.0625, 0.0625]
    scale_limit: [-0.1, 0.1]
    rotate_limit: [-10, 15]
    downscale_range: [0.4, 1.0]
    motion_blur_limit: [3, 5]
    noise_std_range: [0.1, 0.2]
    brightness_limit: [-0.2, 0.2]
    contrast_limit: [-0.2, 0.2]
    compression_quality_range: [40, 100]
    geometric_p: 0.2
    blur_noise_p: 0.2
    color_p: 0.2
    compression_p: 0.2

loss:
  primary_loss: "cross_entropy"
  use_triplet_loss: true
  triplet_weight: 0.2
  triplet_margin: 0.2
  temperature: 0.07
  sigmoid_bias: -10.0

evaluation:
  negative_samples: [1, 2, 3]
  compute_eer: true
  compute_auc: true
  compute_recall_at_k: true
  recall_k_values: [1, 5, 10]
  compute_mrr: true
  compute_ndcg: true
  num_visualization_samples: 10
  save_attention_maps: true

